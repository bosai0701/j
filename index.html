<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>降水ナウキャスト</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <link rel="icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="favicon.ico">

  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@1.14.0/dist/maplibre-gl.css">

  <style>
    html,
    body {
      width:100%;
      height:100%;
      margin:0;
      padding:0;
      overflow:hidden;
      background:#fff;
    }

    #map {
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      visibility:hidden;
      background:#fff;
    }

    .maplibregl-canvas {
      image-rendering:pixelated;
      transform:translateZ(0);
    }

    #loading {
      position:fixed;
      inset:0;
      z-index:99999;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#fff;
      transition:opacity .25s ease;
      font-family:Arial,sans-serif;
    }

    #loading.hide {
      opacity:0;
      pointer-events:none;
    }

    .loading-box {
      width:min(82vw,360px);
      text-align:center;
    }

    .loading-title {
      font-size:20px;
      font-weight:bold;
      color:#222;
      margin-bottom:8px;
    }

    .loading-status {
      min-height:22px;
      font-size:14px;
      color:#666;
      margin-bottom:18px;
      line-height:1.6;
    }

    .loading-spinner {
      width:34px;
      height:34px;
      margin:0 auto 18px;
      border:4px solid #e5e5e5;
      border-top-color:#1976d2;
      border-radius:50%;
      animation:loading-spin .8s linear infinite;
    }

    @keyframes loading-spin {
      to {
        transform:rotate(360deg);
      }
    }

    .loading-progress {
      width:100%;
      height:5px;
      overflow:hidden;
      border-radius:10px;
      background:#e8e8e8;
    }

    .loading-progress-bar {
      width:0%;
      height:100%;
      border-radius:10px;
      background:#1976d2;
      transition:width .1s ease;
    }

    .loading-percent {
      margin-top:9px;
      font-size:12px;
      color:#888;
    }

    #connection-status {
      position:fixed;
      top:10px;
      right:10px;
      z-index:5000;
      padding:6px 10px;
      border-radius:14px;
      background:rgba(255,255,255,.88);
      box-shadow:0 2px 6px rgba(0,0,0,.18);
      font-family:Arial,sans-serif;
      font-size:12px;
      font-weight:bold;
      color:#16823b;
      pointer-events:none;
      display:none;
      white-space:nowrap;
      backdrop-filter:blur(4px);
      -webkit-backdrop-filter:blur(4px);
    }

    #connection-status.unstable {
      color:#d88a00;
    }

    #connection-status.offline {
      color:#d32f2f;
    }

    #info-panel {
      position:absolute;
      top:10px;
      left:10px;
      background:rgba(255,255,255,.85);
      padding:10px 14px;
      border-radius:6px;
      font-size:14px;
      font-family:Arial,sans-serif;
      box-shadow:0 2px 6px rgba(0,0,0,.2);
      z-index:1000;
      visibility:hidden;
      pointer-events:none;
      transform:translateZ(0);
      line-height:1.5;
    }

    #clock {
      font-weight:bold;
    }

    #sat-time,
    #nowcast-time {
      margin-top:2px;
    }

    .maplibregl-ctrl-bottom-left,
    .maplibregl-ctrl-bottom-right {
      display:none !important;
    }
  </style>
</head>

<body>

<div id="loading">
  <div class="loading-box">

    <div id="loading-spinner" class="loading-spinner"></div>

    <div class="loading-title">
      降水ナウキャスト
    </div>

    <div id="loading-status" class="loading-status">
      地図を準備しています…
    </div>

    <div id="loading-progress" class="loading-progress">
      <div id="loading-progress-bar" class="loading-progress-bar"></div>
    </div>

    <div id="loading-percent" class="loading-percent">
      0%
    </div>

  </div>
</div>

<div id="connection-status">
  ● オンライン
</div>

<div id="map"></div>

<div id="info-panel">

  <div id="clock">
    ----/--/-- --:--:--
  </div>

  <div id="sat-time">
    衛星: --
  </div>

  <div id="nowcast-time">
    降水: --
  </div>

</div>

<script src="https://unpkg.com/maplibre-gl@1.14.0/dist/maplibre-gl.js"></script>

<script>

let loadingError = false;
let mapReady = false;
let initializing = false;

let initGeneration = 0;

let jmaConnectionTimer = null;
let nowcastTimer = null;
let satelliteTimer = null;

let initialDisplayTimer = null;


/* =========================================
   DOM
========================================= */

const loading =
  document.getElementById('loading');

const loadingStatus =
  document.getElementById('loading-status');

const loadingProgress =
  document.getElementById('loading-progress');

const loadingProgressBar =
  document.getElementById('loading-progress-bar');

const loadingPercent =
  document.getElementById('loading-percent');

const loadingSpinner =
  document.getElementById('loading-spinner');

const connectionStatus =
  document.getElementById('connection-status');

const mapElement =
  document.getElementById('map');

const infoPanel =
  document.getElementById('info-panel');


/* =========================================
   接続状態
========================================= */

function setConnectionStatus(state) {

  connectionStatus.className = '';

  if (state === 'online') {

    connectionStatus.textContent =
      '● オンライン';

  }

  else if (state === 'unstable') {

    connectionStatus.textContent =
      '● 接続不安定';

    connectionStatus.classList.add(
      'unstable'
    );

  }

  else {

    connectionStatus.textContent =
      '● オフライン';

    connectionStatus.classList.add(
      'offline'
    );

  }

  if (mapReady) {

    connectionStatus.style.display =
      'block';

  }

}


/* =========================================
   初期エラー
========================================= */

function showInitialError(message) {

  loadingError = true;

  initGeneration++;

  if (initialDisplayTimer) {

    clearTimeout(
      initialDisplayTimer
    );

    initialDisplayTimer = null;

  }

  mapElement.style.visibility =
    'hidden';

  infoPanel.style.visibility =
    'hidden';

  loading.style.display =
    'flex';

  loading.classList.remove(
    'hide'
  );

  loadingSpinner.style.display =
    'none';

  loadingProgress.style.display =
    'none';

  loadingPercent.style.display =
    'none';

  loadingStatus.innerHTML =
    message ||
    '降水ナウキャストのデータがありません。<br>' +
    'データがないか、通信に障害が発生しています。';

  if (!navigator.onLine) {

    setConnectionStatus(
      'offline'
    );

  }

  else {

    setConnectionStatus(
      'unstable'
    );

  }

}


/* =========================================
   ローディング
========================================= */

function showLoading() {

  loadingError = false;

  if (initialDisplayTimer) {

    clearTimeout(
      initialDisplayTimer
    );

    initialDisplayTimer = null;

  }

  loading.style.display =
    'flex';

  loading.classList.remove(
    'hide'
  );

  loadingSpinner.style.display =
    'block';

  loadingProgress.style.display =
    'block';

  loadingPercent.style.display =
    'block';

  loadingProgressBar.style.width =
    '0%';

  loadingPercent.textContent =
    '0%';

}


/* =========================================
   進捗
========================================= */

function setLoading(
  text,
  percent
) {

  if (loadingError)
    return;

  if (!navigator.onLine) {

    if (!mapReady) {

      showInitialError(
        'インターネットに接続されていません。<br>' +
        '接続を確認しています…'
      );

    }

    return;

  }

  loadingStatus.textContent =
    text;

  const value =
    Math.max(
      0,
      Math.min(
        100,
        percent
      )
    );

  loadingProgressBar.style.width =
    value + '%';

  loadingPercent.textContent =
    Math.round(value) + '%';

}


/* =========================================
   初回表示
========================================= */

function showMapAfterLoading() {

  if (loadingError)
    return;

  if (!navigator.onLine)
    return;

  loadingProgressBar.style.width =
    '100%';

  loadingPercent.textContent =
    '100%';

  loadingStatus.textContent =
    '地図の表示準備が完了しました';

  if (initialDisplayTimer) {

    clearTimeout(
      initialDisplayTimer
    );

    initialDisplayTimer = null;

  }

  setTimeout(() => {

    if (
      loadingError ||
      !navigator.onLine
    ) {

      return;

    }

    initialDisplayTimer =
      setTimeout(() => {

        initialDisplayTimer = null;

        if (
          loadingError ||
          !navigator.onLine
        ) {

          return;

        }

        mapElement.style.visibility =
          'visible';

        infoPanel.style.visibility =
          'visible';

        mapReady =
          true;

        connectionStatus.style.display =
          'block';

        setConnectionStatus(
          'online'
        );

        requestAnimationFrame(() => {

          map.resize();

          map.triggerRepaint();

        });

        loading.classList.add(
          'hide'
        );

        setTimeout(() => {

          if (
            !loadingError &&
            navigator.onLine
          ) {

            loading.style.display =
              'none';

          }

        }, 300);

      }, 600);

  }, 100);

}


/* =========================================
   ナウキャスト設定
========================================= */

const NOWCAST_OPACITY =
  0.7;

const BASE_ZOOM =
  8;

const HIGH_ZOOM =
  10;

const TILE_SIZE =
  256;


/*
  元の範囲はそのまま。
  768枚のタイルを使う。
*/

const TILE_X_MIN =
  212;

const TILE_X_MAX =
  243;

const TILE_Y_MIN =
  92;

const TILE_Y_MAX =
  115;


/*
  一度に読み込む枚数。
  768枚全部を同時に開始しない。
*/

const MOSAIC_CONCURRENCY =
  24;


/*
  この割合以上成功した場合のみ
  モザイクを正式採用する。
*/

const MOSAIC_MIN_SUCCESS_RATE =
  0.985;


/*
  1回の生成失敗時の最大再試行回数
*/

const MOSAIC_MAX_RETRY =
  3;


const MOSAIC_WIDTH =
  (
    TILE_X_MAX -
    TILE_X_MIN +
    1
  ) *
  TILE_SIZE;

const MOSAIC_HEIGHT =
  (
    TILE_Y_MAX -
    TILE_Y_MIN +
    1
  ) *
  TILE_SIZE;


let latestTime1 = '';
let latestTime2 = '';

let mosaicURL = '';

let previousTimestamp = '';

let z10Generation = 0;
let switchingToZ10 = false;

let mosaicGeneration = 0;


/* =========================================
   衛星
========================================= */

let latestSatValidTime = null;
let latestSatBaseTime = null;

let satChecking = false;
let satGeneration = 0;

let activeSatelliteSourceId = null;
let activeSatelliteLayerId = null;

let satelliteErrorCount = 0;
let satelliteReloadTimer = null;


/* =========================================
   衛星時刻
========================================= */

function formatSatJST(
  utcString
) {

  const value =
    String(utcString);

  const year =
    Number(
      value.slice(0,4)
    );

  const month =
    Number(
      value.slice(4,6)
    ) - 1;

  const day =
    Number(
      value.slice(6,8)
    );

  const hour =
    Number(
      value.slice(8,10)
    );

  const minute =
    Number(
      value.slice(10,12)
    );

  const date =
    new Date(
      Date.UTC(
        year,
        month,
        day,
        hour,
        minute
      )
    );

  date.setUTCHours(
    date.getUTCHours() + 9
  );

  const m =
    String(
      date.getUTCMonth() + 1
    ).padStart(2,'0');

  const d =
    String(
      date.getUTCDate()
    ).padStart(2,'0');

  const h =
    String(
      date.getUTCHours()
    ).padStart(2,'0');

  const min =
    String(
      date.getUTCMinutes()
    ).padStart(2,'0');

  return (
    `${date.getUTCFullYear()}/${m}/${d} ` +
    `${h}:${min} JST`
  );

}


/* =========================================
   最新衛星時刻
========================================= */

async function getSatLatestTime() {

  const controller =
    new AbortController();

  const timeout =
    setTimeout(
      () => {
        controller.abort();
      },
      5000
    );

  try {

    const response =
      await fetch(
        'https://www.jma.go.jp/bosai/himawari/data/satimg/targetTimes_fd.json?' +
        Date.now(),
        {
          cache:'no-store',
          signal:controller.signal
        }
      );

    if (!response.ok) {

      throw new Error(
        'targetTimes_fd.json取得失敗'
      );

    }

    const data =
      await response.json();

    if (
      !Array.isArray(data) ||
      data.length === 0
    ) {

      throw new Error(
        '時刻データがありません'
      );

    }

    data.sort(
      (a,b) =>
        String(a.validtime)
          .localeCompare(
            String(b.validtime)
          )
    );

    return data[
      data.length - 1
    ];

  }

  finally {

    clearTimeout(
      timeout
    );

  }

}


/* =========================================
   衛星レイヤー削除
========================================= */

function removeSatelliteLayer(
  sourceId,
  layerId
) {

  if (
    layerId &&
    map.getLayer(layerId)
  ) {

    map.removeLayer(
      layerId
    );

  }

  if (
    sourceId &&
    map.getSource(sourceId)
  ) {

    map.removeSource(
      sourceId
    );

  }

}


/* =========================================
   古い衛星レイヤー削除
========================================= */

function removeOldSatelliteLayers(
  keepSourceId,
  keepLayerId
) {

  const layers =
    map.getStyle().layers ||
    [];

  for (
    const layer of layers
  ) {

    if (
      !layer.id.startsWith(
        'himawari-layer-'
      )
    ) {

      continue;

    }

    if (
      layer.id ===
      keepLayerId
    ) {

      continue;

    }

    const sourceId =
      layer.source;

    if (
      map.getLayer(
        layer.id
      )
    ) {

      map.removeLayer(
        layer.id
      );

    }

    if (
      sourceId &&
      sourceId !== keepSourceId &&
      map.getSource(
        sourceId
      )
    ) {

      map.removeSource(
        sourceId
      );

    }

  }

}


/* =========================================
   衛星更新
========================================= */

async function updateSatellite() {

  if (satChecking)
    return;

  if (!map.loaded())
    return;

  if (!navigator.onLine) {

    setConnectionStatus(
      'offline'
    );

    return;

  }

  satChecking =
    true;

  const generation =
    ++satGeneration;

  try {

    const target =
      await getSatLatestTime();

    if (
      generation !==
      satGeneration
    ) {

      return;

    }

    const baseTime =
      String(
        target.basetime
      );

    const validTime =
      String(
        target.validtime
      );

    if (
      latestSatValidTime ===
        validTime &&
      latestSatBaseTime ===
        baseTime &&
      activeSatelliteLayerId &&
      map.getLayer(
        activeSatelliteLayerId
      ) &&
      activeSatelliteSourceId &&
      map.getSource(
        activeSatelliteSourceId
      )
    ) {

      return;

    }

    const sourceId =
      'himawari-source-' +
      generation;

    const layerId =
      'himawari-layer-' +
      generation;

    const tileURL =
      'https://www.jma.go.jp/bosai/himawari/data/satimg/' +
      baseTime +
      '/fd/' +
      validTime +
      '/B13/TBB/{z}/{x}/{y}.jpg';

    map.addSource(
      sourceId,
      {

        type:'raster',

        tiles:[
          tileURL
        ],

        tileSize:256,

        minzoom:0,

        maxzoom:5,

        attribution:'© 気象庁'

      }
    );

    map.addLayer(
      {

        id:layerId,

        type:'raster',

        source:sourceId,

        minzoom:0,

        maxzoom:19,

        paint:{

          'raster-opacity':
            0.65,

          'raster-resampling':
            'nearest',

          'raster-fade-duration':
            0

        }

      },
      'jma-mask'
    );


    /*
      新衛星画像を確認。
      古い画像はここでは消さない。
    */

    const waitStart =
      performance.now();

    const waitForSource = () => {

      return new Promise(
        resolve => {

          let finished =
            false;

          const finish = (
            value
          ) => {

            if (finished)
              return;

            finished =
              true;

            map.off(
              'sourcedata',
              handler
            );

            resolve(value);

          };

          const handler = (
            event
          ) => {

            if (
              event.sourceId !==
              sourceId
            ) {

              return;

            }

            if (
              map.isSourceLoaded(
                sourceId
              )
            ) {

              finish(true);

            }

          };

          map.on(
            'sourcedata',
            handler
          );

          if (
            map.isSourceLoaded(
              sourceId
            )
          ) {

            finish(true);

          }

          setTimeout(
            () => {

              finish(
                false
              );

            },
            5000
          );

        }
      );

    };


    const loaded =
      await waitForSource();


    if (
      generation !==
      satGeneration
    ) {

      removeSatelliteLayer(
        sourceId,
        layerId
      );

      return;

    }


    if (!loaded) {

      removeSatelliteLayer(
        sourceId,
        layerId
      );

      throw new Error(
        '衛星タイル読み込みタイムアウト'
      );

    }


    /*
      新画像を正式採用
    */

    const oldSourceId =
      activeSatelliteSourceId;

    const oldLayerId =
      activeSatelliteLayerId;

    activeSatelliteSourceId =
      sourceId;

    activeSatelliteLayerId =
      layerId;

    latestSatValidTime =
      validTime;

    latestSatBaseTime =
      baseTime;

    satelliteErrorCount =
      0;

    document.getElementById(
      'sat-time'
    ).textContent =
      '衛星: ' +
      formatSatJST(
        validTime
      );


    /*
      正常に新画像が入ったあと
      古い画像を削除
    */

    if (
      oldLayerId &&
      oldLayerId !== layerId
    ) {

      removeSatelliteLayer(
        oldSourceId,
        oldLayerId
      );

    }

    removeOldSatelliteLayers(
      sourceId,
      layerId
    );

    map.triggerRepaint();

  }

  catch (error) {

    console.warn(
      '衛星画像更新エラー:',
      error
    );

    if (navigator.onLine) {

      setConnectionStatus(
        'unstable'
      );

    }

  }

  finally {

    satChecking =
      false;

  }

}


/* =========================================
   JMA通信速度チェック
========================================= */

async function checkJMAConnection() {

  if (!navigator.onLine) {

    setConnectionStatus(
      'offline'
    );

    return false;

  }

  const start =
    performance.now();

  const controller =
    new AbortController();

  const timeout =
    setTimeout(
      () => {
        controller.abort();
      },
      5000
    );

  try {

    const response =
      await fetch(
        'https://www.jma.go.jp/bosai/jmatile/data/nowc/targetTimes_N1.json?check=' +
        Date.now(),
        {
          cache:'no-store',
          signal:controller.signal
        }
      );

    clearTimeout(
      timeout
    );

    const elapsed =
      performance.now() -
      start;

    if (!response.ok) {

      setConnectionStatus(
        navigator.onLine ?
        'unstable' :
        'offline'
      );

      return false;

    }

    if (
      elapsed >= 1000
    ) {

      setConnectionStatus(
        'unstable'
      );

    }

    else {

      setConnectionStatus(
        'online'
      );

    }

    return true;

  }

  catch (error) {

    clearTimeout(
      timeout
    );

    setConnectionStatus(
      navigator.onLine ?
      'unstable' :
      'offline'
    );

    return false;

  }

}


/* =========================================
   通信状況
========================================= */

function startConnectionMonitor() {

  if (jmaConnectionTimer) {

    clearInterval(
      jmaConnectionTimer
    );

  }

  jmaConnectionTimer =
    setInterval(
      () => {

        checkJMAConnection();

      },
      1000
    );

}


/* =========================================
   最新時刻取得
========================================= */

async function fetchLatestTimes() {

  if (!navigator.onLine) {

    if (!mapReady) {

      showInitialError(
        'インターネットに接続されていません。<br>' +
        '接続を確認しています…'
      );

    }

    return false;

  }

  try {

    const response =
      await fetch(
        'https://www.jma.go.jp/bosai/jmatile/data/nowc/targetTimes_N1.json?_' +
        Date.now(),
        {
          cache:'no-store'
        }
      );

    if (!response.ok) {

      if (mapReady) {

        setConnectionStatus(
          'unstable'
        );

      }

      else {

        showInitialError();

      }

      return false;

    }

    const data =
      await response.json();

    if (
      !Array.isArray(data) ||
      data.length === 0
    ) {

      if (mapReady) {

        setConnectionStatus(
          'unstable'
        );

      }

      else {

        showInitialError();

      }

      return false;

    }

    const newTime1 =
      data[0].basetime;

    const newTime2 =
      data[0].validtime;

    if (
      !newTime1 ||
      !newTime2
    ) {

      return false;

    }

    const changed =
      newTime1 !== latestTime1 ||
      newTime2 !== latestTime2;

    latestTime1 =
      newTime1;

    latestTime2 =
      newTime2;

    document.getElementById(
      'nowcast-time'
    ).textContent =
      '降水: ' +
      formatSatJST(
        String(newTime2)
      );

    return changed;

  }

  catch (error) {

    console.warn(
      'JMA時刻取得エラー:',
      error
    );

    setConnectionStatus(
      navigator.onLine ?
      'unstable' :
      'offline'
    );

    if (!mapReady) {

      showInitialError();

    }

    return false;

  }

}


/* =========================================
   JMAタイルURL
========================================= */

function jmaTileURL(
  x,
  y
) {

  return (
    'https://www.jma.go.jp/bosai/jmatile/data/nowc/' +
    latestTime1 +
    '/none/' +
    latestTime2 +
    '/surf/hrpns/' +
    BASE_ZOOM +
    '/' +
    x +
    '/' +
    y +
    '.png'
  );

}


/* =========================================
   画像読み込み
========================================= */

function loadImage(url) {

  return new Promise(
    resolve => {

      const img =
        new Image();

      img.decoding =
        'async';

      img.crossOrigin =
        'anonymous';

      let finished =
        false;

      const finish = (
        value
      ) => {

        if (finished)
          return;

        finished =
          true;

        resolve(value);

      };

      img.onload =
        () => finish(img);

      img.onerror =
        () => finish(null);

      img.src =
        url;

    }
  );

}


/* =========================================
   モザイク完全削除
========================================= */

function clearMosaic() {

  if (
    map.getLayer(
      'nowcast-z8-mosaic-layer'
    )
  ) {

    map.removeLayer(
      'nowcast-z8-mosaic-layer'
    );

  }

  if (
    map.getSource(
      'nowcast-z8-mosaic'
    )
  ) {

    map.removeSource(
      'nowcast-z8-mosaic'
    );

  }

  if (mosaicURL) {

    URL.revokeObjectURL(
      mosaicURL
    );

    mosaicURL =
      '';

  }

}


/* =========================================
   Z10完全削除
========================================= */

function clearZ10Layers() {

  const layers =
    map.getStyle().layers ||
    [];

  for (
    const layer of layers
  ) {

    if (
      !layer.id.startsWith(
        'nowcast-z10-layer-'
      )
    ) {

      continue;

    }

    const source =
      layer.source;

    if (
      map.getLayer(
        layer.id
      )
    ) {

      map.removeLayer(
        layer.id
      );

    }

    if (
      source &&
      map.getSource(
        source
      )
    ) {

      map.removeSource(
        source
      );

    }

  }

  switchingToZ10 =
    false;

  z10Generation++;

}


/* =========================================
   ナウキャスト描画を完全リセット
========================================= */

function resetNowcastRendering() {

  mosaicGeneration++;

  clearMosaic();

  clearZ10Layers();

  map.triggerRepaint();

}


/* =========================================
   Z8モザイク
========================================= */

async function createMosaic() {

  if (
    !latestTime1 ||
    !latestTime2
  ) {

    return false;

  }

  for (
    let retry = 1;
    retry <= MOSAIC_MAX_RETRY;
    retry++
  ) {

    const generation =
      mosaicGeneration;

    if (!navigator.onLine) {

      if (!mapReady) {

        showInitialError();

      }

      return false;

    }

    /*
      再試行前に古い描画を完全消去
    */

    clearMosaic();

    setLoading(
      retry === 1
        ? '降水タイルを読み込んでいます…'
        : `降水タイルを再読み込みしています… (${retry}/${MOSAIC_MAX_RETRY})`,
      10
    );


    const canvas =
      document.createElement(
        'canvas'
      );

    canvas.width =
      MOSAIC_WIDTH;

    canvas.height =
      MOSAIC_HEIGHT;

    const ctx =
      canvas.getContext(
        '2d',
        {
          alpha:true,
          willReadFrequently:false
        }
      );

    if (!ctx) {

      return false;

    }

    ctx.imageSmoothingEnabled =
      false;


    const totalTiles =
      (
        TILE_X_MAX -
        TILE_X_MIN +
        1
      ) *
      (
        TILE_Y_MAX -
        TILE_Y_MIN +
        1
      );


    const tiles = [];

    for (
      let y = TILE_Y_MIN;
      y <= TILE_Y_MAX;
      y++
    ) {

      for (
        let x = TILE_X_MIN;
        x <= TILE_X_MAX;
        x++
      ) {

        tiles.push({
          x,
          y
        });

      }

    }


    let nextIndex =
      0;

    let loadedTiles =
      0;

    let failedTiles =
      0;


    /*
      24枚ずつ処理。
      768枚を一度にPromise化しない。
    */

    async function worker() {

      while (true) {

        if (
          generation !==
          mosaicGeneration
        ) {

          return;

        }

        const index =
          nextIndex++;

        if (
          index >=
          tiles.length
        ) {

          return;

        }

        const tile =
          tiles[index];

        const img =
          await loadImage(
            jmaTileURL(
              tile.x,
              tile.y
            )
          );

        if (
          generation !==
          mosaicGeneration
        ) {

          return;

        }

        if (img) {

          const dx =
            (
              tile.x -
              TILE_X_MIN
            ) *
            TILE_SIZE;

          const dy =
            (
              tile.y -
              TILE_Y_MIN
            ) *
            TILE_SIZE;

          ctx.drawImage(
            img,
            dx,
            dy,
            TILE_SIZE,
            TILE_SIZE
          );

          loadedTiles++;

        }

        else {

          failedTiles++;

        }

        const completed =
          loadedTiles +
          failedTiles;

        const progress =
          completed /
          totalTiles;

        setLoading(
          `降水タイルを読み込み中… ${completed}/${totalTiles}`,
          15 +
          progress * 70
        );

      }

    }


    const workers = [];

    const workerCount =
      Math.min(
        MOSAIC_CONCURRENCY,
        totalTiles
      );

    for (
      let i = 0;
      i < workerCount;
      i++
    ) {

      workers.push(
        worker()
      );

    }

    await Promise.all(
      workers
    );


    if (
      generation !==
      mosaicGeneration
    ) {

      return false;

    }


    if (!navigator.onLine) {

      if (!mapReady) {

        showInitialError();

      }

      return false;

    }


    const successRate =
      loadedTiles /
      totalTiles;


    /*
      タイルが足りない状態では
      絶対に古い/欠けたモザイクを表示しない。
    */

    if (
      successRate <
      MOSAIC_MIN_SUCCESS_RATE
    ) {

      console.warn(
        'モザイク不完全:',
        loadedTiles,
        '/',
        totalTiles,
        '成功率:',
        successRate
      );

      setLoading(
        `画像が正常に読み込めませんでした。再読み込み中…`,
        90
      );

      /*
        少しだけ待ってから完全再処理
      */

      await new Promise(
        resolve =>
          setTimeout(
            resolve,
            150
          )
      );

      continue;

    }


    setLoading(
      '降水画像を生成しています…',
      90
    );


    const blob =
      await new Promise(
        resolve => {

          canvas.toBlob(
            resolve,
            'image/png'
          );

        }
      );


    if (!blob) {

      console.warn(
        'モザイクPNG生成失敗'
      );

      continue;

    }


    if (
      generation !==
      mosaicGeneration ||
      !navigator.onLine
    ) {

      return false;

    }


    const newURL =
      URL.createObjectURL(
        blob
      );


    /*
      正常完成したものだけ採用
    */

    if (mosaicURL) {

      URL.revokeObjectURL(
        mosaicURL
      );

    }

    mosaicURL =
      newURL;


    setLoading(
      '地図を仕上げています…',
      96
    );


    return true;

  }


  /*
    3回やってもダメ
  */

  console.warn(
    'モザイク再読み込み上限到達'
  );

  resetNowcastRendering();

  return false;

}


/* =========================================
   座標
========================================= */

function tileXToLng(x) {

  return (
    x /
    Math.pow(
      2,
      BASE_ZOOM
    )
  ) *
  360 -
  180;

}


function tileYToLat(y) {

  const n =
    Math.PI -
    (
      2 *
      Math.PI *
      y /
      Math.pow(
        2,
        BASE_ZOOM
      )
    );

  return (
    180 /
    Math.PI
  ) *
  Math.atan(
    0.5 *
    (
      Math.exp(n) -
      Math.exp(-n)
    )
  );

}


const west =
  tileXToLng(
    TILE_X_MIN
  );

const east =
  tileXToLng(
    TILE_X_MAX + 1
  );

const north =
  tileYToLat(
    TILE_Y_MIN
  );

const south =
  tileYToLat(
    TILE_Y_MAX + 1
  );


/* =========================================
   MapLibre
========================================= */

const map =
  new maplibregl.Map({

    container:'map',

    center:[
      134.5,
      34.5
    ],

    zoom:3.2,

    minZoom:3,

    maxZoom:13,

    bearing:0,

    pitch:0,

    attributionControl:false,

    antialias:false,

    preserveDrawingBuffer:false,

    fadeDuration:0,

    style:{

      version:8,

      sources:{

        'gsi-pale':{

          type:'raster',

          tiles:[
            'https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png'
          ],

          tileSize:256,

          minzoom:0,

          maxzoom:18,

          attribution:
            '© 国土地理院'

        },

        'jma-mask':{

          type:'raster',

          tiles:[
            'https://www.jma.go.jp/bosai/jmatile/data/map/none/none/none/surf/mask/{z}/{x}/{y}.png'
          ],

          tileSize:256,

          minzoom:0,

          maxzoom:16

        }

      },

      layers:[

        {
          id:'base',

          type:'raster',

          source:'gsi-pale',

          minzoom:0,

          maxzoom:18,

          paint:{

            'raster-opacity':1,

            'raster-resampling':
              'linear',

            'raster-fade-duration':
              0

          }

        },

        {
          id:'jma-mask',

          type:'raster',

          source:'jma-mask',

          minzoom:0,

          maxzoom:16,

          paint:{

            'raster-opacity':1,

            'raster-saturation':-1,

            'raster-resampling':
              'nearest',

            'raster-fade-duration':
              0

          }

        }

      ]

    }

  });


/* =========================================
   Z8
========================================= */

function addOrUpdateZ8() {

  if (!mosaicURL)
    return false;

  const coordinates = [
    [west,north],
    [east,north],
    [east,south],
    [west,south]
  ];


  /*
    既存Sourceが無い場合
  */

  if (
    !map.getSource(
      'nowcast-z8-mosaic'
    )
  ) {

    map.addSource(
      'nowcast-z8-mosaic',
      {

        type:'image',

        url:mosaicURL,

        coordinates:
          coordinates

      }
    );

    map.addLayer({

      id:
        'nowcast-z8-mosaic-layer',

      type:'raster',

      source:
        'nowcast-z8-mosaic',

      minzoom:3,

      maxzoom:10,

      paint:{

        'raster-opacity':
          NOWCAST_OPACITY,

        'raster-resampling':
          'nearest',

        'raster-fade-duration':
          0

      }

    });

    return true;

  }


  /*
    既存画像を更新
  */

  map
    .getSource(
      'nowcast-z8-mosaic'
    )
    .updateImage({

      url:mosaicURL,

      coordinates:
        coordinates

    });

  return true;

}


/* =========================================
   Z10
========================================= */

function addZ10Layer(
  time1,
  time2
) {

  if (!navigator.onLine)
    return;

  const generation =
    ++z10Generation;

  const sourceId =
    'nowcast-z10-' +
    generation;

  const layerId =
    'nowcast-z10-layer-' +
    generation;

  const url =
    'https://www.jma.go.jp/bosai/jmatile/data/nowc/' +
    time1 +
    '/none/' +
    time2 +
    '/surf/hrpns/10/{x}/{y}.png';

  map.addSource(
    sourceId,
    {

      type:'raster',

      tiles:[
        url
      ],

      tileSize:256,

      minzoom:10,

      maxzoom:14

    }
  );

  map.addLayer({

    id:layerId,

    type:'raster',

    source:sourceId,

    minzoom:10,

    maxzoom:14,

    paint:{

      'raster-opacity':
        NOWCAST_OPACITY,

      'raster-resampling':
        'nearest',

      'raster-fade-duration':
        0

    }

  });


  const checkLoaded = () => {

    if (
      generation !==
      z10Generation
    ) {

      return;

    }

    if (!navigator.onLine) {

      setConnectionStatus(
        'offline'
      );

      return;

    }

    if (
      !map.getSource(
        sourceId
      )
    ) {

      return;

    }

    if (
      map.isSourceLoaded(
        sourceId
      )
    ) {

      if (
        map.getLayer(
          'nowcast-z8-mosaic-layer'
        )
      ) {

        map.setPaintProperty(
          'nowcast-z8-mosaic-layer',
          'raster-opacity',
          0
        );

      }

      const layers =
        map.getStyle().layers ||
        [];

      for (
        const layer of layers
      ) {

        if (
          layer.id.startsWith(
            'nowcast-z10-layer-'
          ) &&
          layer.id !== layerId
        ) {

          const oldSource =
            layer.source;

          if (
            map.getLayer(
              layer.id
            )
          ) {

            map.removeLayer(
              layer.id
            );

          }

          if (
            oldSource &&
            map.getSource(
              oldSource
            )
          ) {

            map.removeSource(
              oldSource
            );

          }

        }

      }

      switchingToZ10 =
        false;

      map.triggerRepaint();

      return;

    }

    requestAnimationFrame(
      checkLoaded
    );

  };

  requestAnimationFrame(
    checkLoaded
  );

}


/* =========================================
   ズーム切り替え
========================================= */

function updateZoomLayers() {

  if (!navigator.onLine) {

    setConnectionStatus(
      'offline'
    );

    return;

  }

  const zoom =
    map.getZoom();


  if (
    zoom >= HIGH_ZOOM
  ) {

    const layers =
      map.getStyle().layers ||
      [];

    const z10Exists =
      layers.some(
        layer =>
          layer.id.startsWith(
            'nowcast-z10-layer-'
          )
      );

    if (
      !z10Exists &&
      !switchingToZ10 &&
      latestTime1 &&
      latestTime2
    ) {

      switchingToZ10 =
        true;

      addZ10Layer(
        latestTime1,
        latestTime2
      );

    }

    return;

  }


  if (
    map.getLayer(
      'nowcast-z8-mosaic-layer'
    )
  ) {

    map.setPaintProperty(
      'nowcast-z8-mosaic-layer',
      'raster-opacity',
      NOWCAST_OPACITY
    );

  }


  clearZ10Layers();

  map.triggerRepaint();

}


map.on(
  'zoom',
  updateZoomLayers
);


/* =========================================
   ナウキャスト更新
========================================= */

async function updateNowcastLayers() {

  /*
    新しい描画を作る前に
    前の描画を消す。
  */

  resetNowcastRendering();

  const ready =
    await createMosaic();

  if (!ready)
    return false;


  if (
    !addOrUpdateZ8()
  ) {

    resetNowcastRendering();

    return false;

  }


  if (
    map.getZoom() >=
    HIGH_ZOOM
  ) {

    switchingToZ10 =
      true;

    addZ10Layer(
      latestTime1,
      latestTime2
    );

  }

  map.triggerRepaint();

  return true;

}


/* =========================================
   ナウキャスト確認
========================================= */

async function checkNowcastUpdate() {

  if (!mapReady)
    return;

  if (!navigator.onLine) {

    setConnectionStatus(
      'offline'
    );

    return;

  }

  const changed =
    await fetchLatestTimes();

  if (!changed)
    return;


  const timestamp =
    latestTime1 +
    '_' +
    latestTime2;


  if (
    timestamp ===
    previousTimestamp
  ) {

    return;

  }


  /*
    新しい時刻になったら
    前の描画を捨てて最初から作る。
  */

  previousTimestamp =
    timestamp;


  const ready =
    await updateNowcastLayers();


  if (ready) {

    checkJMAConnection();

  }

  else {

    if (navigator.onLine) {

      setConnectionStatus(
        'unstable'
      );

    }

  }

}


/* =========================================
   MapLibreエラー監視
========================================= */

map.on(
  'error',
  event => {

    if (
      event &&
      event.error
    ) {

      console.warn(
        'MapLibre:',
        event.error
      );


      /*
        衛星画像のエラーを検出。
        連続したエラーなら
        衛星レイヤーを作り直す。
      */

      if (
        event.sourceId &&
        String(
          event.sourceId
        ).startsWith(
          'himawari-source-'
        )
      ) {

        satelliteErrorCount++;


        if (
          satelliteErrorCount >= 2 &&
          !satelliteReloadTimer
        ) {

          satelliteReloadTimer =
            setTimeout(
              () => {

                satelliteReloadTimer =
                  null;

                satelliteErrorCount =
                  0;

                /*
                  現在の衛星画像を一旦破棄。
                  新しい画像を最初から読み込む。
                */

                const oldSource =
                  activeSatelliteSourceId;

                const oldLayer =
                  activeSatelliteLayerId;

                activeSatelliteSourceId =
                  null;

                activeSatelliteLayerId =
                  null;

                latestSatValidTime =
                  null;

                latestSatBaseTime =
                  null;

                removeSatelliteLayer(
                  oldSource,
                  oldLayer
                );

                updateSatellite();

              },
              150
            );

        }

      }


      if (navigator.onLine) {

        setConnectionStatus(
          'unstable'
        );

      }

      else {

        setConnectionStatus(
          'offline'
        );

      }

    }

  });


/* =========================================
   初期化
========================================= */

async function initialize() {

  if (initializing)
    return;

  initializing =
    true;

  const generation =
    ++initGeneration;


  /*
    初期化時は必ず
    古い描画を完全リセット。
  */

  resetNowcastRendering();

  showLoading();


  if (!navigator.onLine) {

    showInitialError(
      'インターネットに接続されていません。<br>' +
      '接続を確認しています…'
    );

    initializing =
      false;

    return;

  }


  const connectionOK =
    await checkJMAConnection();


  if (
    generation !==
    initGeneration
  ) {

    initializing =
      false;

    return;

  }


  if (!connectionOK) {

    showInitialError();

    initializing =
      false;

    return;

  }


  setLoading(
    '気象庁データの時刻を取得しています…',
    8
  );


  await fetchLatestTimes();


  if (
    generation !==
      initGeneration ||
    loadingError ||
    !navigator.onLine ||
    !latestTime1 ||
    !latestTime2
  ) {

    if (!mapReady) {

      showInitialError();

    }

    initializing =
      false;

    return;

  }


  const timestamp =
    latestTime1 +
    '_' +
    latestTime2;


  previousTimestamp =
    timestamp;


  const ready =
    await updateNowcastLayers();


  if (
    generation !==
      initGeneration ||
    !ready ||
    !navigator.onLine
  ) {

    if (!mapReady) {

      showInitialError(
        '降水ナウキャストを正常に読み込めませんでした。<br>' +
        '通信を確認して、もう一度お試しください。'
      );

    }

    initializing =
      false;

    return;

  }


  showMapAfterLoading();

  initializing =
    false;

  startConnectionMonitor();

}


/* =========================================
   オフライン
========================================= */

window.addEventListener(
  'offline',
  () => {

    setConnectionStatus(
      'offline'
    );

    if (!mapReady) {

      showInitialError(
        'インターネットに接続されていません。<br>' +
        '接続を確認しています…'
      );

    }

  }
);


/* =========================================
   オンライン復帰
========================================= */

window.addEventListener(
  'online',
  () => {

    if (mapReady) {

      checkJMAConnection();

      updateSatellite();

      checkNowcastUpdate();

      return;

    }

    if (!initializing) {

      initialize();

    }

  }
);


/* =========================================
   通信状況
========================================= */

startConnectionMonitor();


/* =========================================
   ナウキャスト
   3秒ごと
========================================= */

nowcastTimer =
  setInterval(
    () => {

      if (
        mapReady &&
        !document.hidden
      ) {

        checkNowcastUpdate();

      }

    },
    3000
  );


/* =========================================
   衛星
   30秒ごと
========================================= */

satelliteTimer =
  setInterval(
    () => {

      if (
        mapReady &&
        !document.hidden
      ) {

        updateSatellite();

      }

    },
    30000
  );


/* =========================================
   時計
========================================= */

function updateClock() {

  const now =
    new Date();

  const year =
    now.getFullYear();

  const month =
    String(
      now.getMonth() + 1
    ).padStart(
      2,
      '0'
    );

  const day =
    String(
      now.getDate()
    ).padStart(
      2,
      '0'
    );

  const hours =
    String(
      now.getHours()
    ).padStart(
      2,
      '0'
    );

  const minutes =
    String(
      now.getMinutes()
    ).padStart(
      2,
      '0'
    );

  const seconds =
    String(
      now.getSeconds()
    ).padStart(
      2,
      '0'
    );

  document.getElementById(
    'clock'
  ).textContent =
    `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;

}


setInterval(
  updateClock,
  1000
);

updateClock();


/* =========================================
   Map読み込み完了
========================================= */

map.on(
  'load',
  () => {

    updateSatellite();

    initialize();

  }
);


/* =========================================
   アプリ復帰
========================================= */

document.addEventListener(
  'visibilitychange',
  () => {

    if (
      !document.hidden &&
      mapReady
    ) {

      updateSatellite();

      checkNowcastUpdate();

      checkJMAConnection();

      requestAnimationFrame(() => {

        map.resize();

        map.triggerRepaint();

      });

    }

  }
);
