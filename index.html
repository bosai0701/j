<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>降水ナウキャスト</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <link rel="icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="favicon.ico">

  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@1.14.0/dist/maplibre-gl.css">

  <style>
    html, body {
      width:100%;
      height:100%;
      margin:0;
      padding:0;
      overflow:hidden;
      background:#fff;
    }

    #map {
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      visibility:hidden;
      background:#fff;
    }

    .maplibregl-canvas {
      image-rendering:pixelated;
      transform:translateZ(0);
    }

    #loading {
      position:fixed;
      inset:0;
      z-index:99999;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#fff;
      transition:opacity .25s ease;
      font-family:Arial,sans-serif;
    }

    #loading.hide {
      opacity:0;
      pointer-events:none;
    }

    .loading-box {
      width:min(82vw,360px);
      text-align:center;
    }

    .loading-title {
      font-size:20px;
      font-weight:bold;
      color:#222;
      margin-bottom:8px;
    }

    .loading-status {
      min-height:22px;
      font-size:14px;
      color:#666;
      margin-bottom:18px;
      line-height:1.6;
    }

    .loading-spinner {
      width:34px;
      height:34px;
      margin:0 auto 18px;
      border:4px solid #e5e5e5;
      border-top-color:#1976d2;
      border-radius:50%;
      animation:loading-spin .8s linear infinite;
    }

    @keyframes loading-spin {
      to {
        transform:rotate(360deg);
      }
    }

    .loading-progress {
      width:100%;
      height:5px;
      overflow:hidden;
      border-radius:10px;
      background:#e8e8e8;
    }

    .loading-progress-bar {
      width:0%;
      height:100%;
      border-radius:10px;
      background:#1976d2;
      transition:width .1s ease;
    }

    .loading-percent {
      margin-top:9px;
      font-size:12px;
      color:#888;
    }

    /* =========================================
       右上：通信状態
    ========================================= */

    #connection-status {
      position:fixed;
      top:10px;
      right:10px;
      z-index:5000;
      padding:6px 10px;
      border-radius:14px;
      background:rgba(255,255,255,.88);
      box-shadow:0 2px 6px rgba(0,0,0,.18);
      font-family:Arial,sans-serif;
      font-size:12px;
      font-weight:bold;
      color:#16823b;
      pointer-events:none;
      display:none;
      white-space:nowrap;
      backdrop-filter:blur(4px);
      -webkit-backdrop-filter:blur(4px);
    }

    #connection-status.unstable {
      color:#d88a00;
    }

    #connection-status.error {
      color:#00AAFF;
    }

    #connection-status.offline {
      color:#d32f2f;
    }

    /* =========================================
       左上：時刻情報
    ========================================= */

    #info-panel {
      position:absolute;
      top:10px;
      left:10px;
      background:rgba(255,255,255,.85);
      padding:10px 14px;
      border-radius:6px;
      font-size:14px;
      font-family:Arial,sans-serif;
      box-shadow:0 2px 6px rgba(0,0,0,.2);
      z-index:1000;
      visibility:hidden;
      pointer-events:none;
      transform:translateZ(0);
      line-height:1.5;
    }

    #clock {
      font-weight:bold;
    }

    #sat-time,
    #nowcast-time {
      margin-top:2px;
    }

    .maplibregl-ctrl-bottom-left,
    .maplibregl-ctrl-bottom-right {
      display:none !important;
    }
  </style>
</head>

<body>

<div id="loading">
  <div class="loading-box">

    <div id="loading-spinner" class="loading-spinner"></div>

    <div class="loading-title">
      降水ナウキャスト
    </div>

    <div id="loading-status" class="loading-status">
      地図を準備しています…
    </div>

    <div id="loading-progress" class="loading-progress">
      <div id="loading-progress-bar" class="loading-progress-bar"></div>
    </div>

    <div id="loading-percent" class="loading-percent">
      0%
    </div>

  </div>
</div>

<div id="connection-status">
  ● オンライン
</div>

<div id="map"></div>

<div id="info-panel">

  <div id="clock">
    ----/--/-- --:--:--
  </div>

  <div id="sat-time">
    衛星: --
  </div>

  <div id="nowcast-time">
    降水: --
  </div>

</div>

<script src="https://unpkg.com/maplibre-gl@1.14.0/dist/maplibre-gl.js"></script>

<script>

let loadingError = false;
let mapReady = false;
let initializing = false;

let connectionCheckTimer = null;
let jmaConnectionTimer = null;

let initGeneration = 0;

const loading =
  document.getElementById('loading');

const loadingStatus =
  document.getElementById('loading-status');

const loadingProgress =
  document.getElementById('loading-progress');

const loadingProgressBar =
  document.getElementById('loading-progress-bar');

const loadingPercent =
  document.getElementById('loading-percent');

const loadingSpinner =
  document.getElementById('loading-spinner');

const connectionStatus =
  document.getElementById('connection-status');


/* =========================================
   接続状態表示
========================================= */

function setConnectionStatus(state) {

  connectionStatus.className = '';

  if (state === 'online') {

    connectionStatus.textContent =
      '● オンライン';

  }

  else if (state === 'unstable') {

    connectionStatus.textContent =
      '● 接続不安定';

    connectionStatus.classList.add('unstable');

  }

  else if (state === 'error') {

    connectionStatus.textContent =
      '● 通信エラー';

    connectionStatus.classList.add('error');

  }

  else {

    connectionStatus.textContent =
      '● オフライン';

    connectionStatus.classList.add('offline');

  }

  if (mapReady) {

    connectionStatus.style.display =
      'block';

  }
}


/* =========================================
   初期エラー
========================================= */

function showInitialError(message) {

  loadingError = true;

  initGeneration++;

  document.getElementById('map')
    .style.visibility = 'hidden';

  document.getElementById('info-panel')
    .style.visibility = 'hidden';

  loading.style.display = 'flex';

  loading.classList.remove('hide');

  loadingSpinner.style.display = 'none';

  loadingProgress.style.display = 'none';

  loadingPercent.style.display = 'none';

  loadingStatus.innerHTML =
    message ||
    '降水ナウキャストのデータがありません。<br>' +
    'データがないか、通信に障害が発生しています。';

  if (!navigator.onLine) {

    setConnectionStatus('offline');

  }
  else {

    setConnectionStatus('error');

  }
}


/* =========================================
   ローディング
========================================= */

function showLoading() {

  loadingError = false;

  loading.style.display = 'flex';

  loading.classList.remove('hide');

  loadingSpinner.style.display = 'block';

  loadingProgress.style.display = 'block';

  loadingPercent.style.display = 'block';

}

function setLoading(text, percent) {

  if (loadingError) return;

  if (!navigator.onLine) {

    if (!mapReady) {

      showInitialError(
        'インターネットに接続されていません。<br>' +
        '接続を確認しています…'
      );

    }

    return;

  }

  loadingStatus.textContent = text;

  const value =
    Math.max(0, Math.min(100, percent));

  loadingProgressBar.style.width =
    value + '%';

  loadingPercent.textContent =
    Math.round(value) + '%';

}

function hideLoading() {

  if (loadingError) return;

  if (!navigator.onLine) return;

  loadingProgressBar.style.width = '100%';

  loadingPercent.textContent = '100%';

  setTimeout(() => {

    if (loadingError) return;

    if (!navigator.onLine) return;

    loading.classList.add('hide');

    setTimeout(() => {

      if (
        !loadingError &&
        navigator.onLine
      ) {

        loading.style.display = 'none';

      }

    }, 300);

  }, 950);

}


/* =========================================
   降水ナウキャスト設定
========================================= */

const NOWCAST_OPACITY = 0.77;

const BASE_ZOOM = 8;

const HIGH_ZOOM = 10;

const TILE_SIZE = 256;

const TILE_X_MIN = 212;

const TILE_X_MAX = 243;

const TILE_Y_MIN = 92;

const TILE_Y_MAX = 115;

const MOSAIC_WIDTH =
  (TILE_X_MAX - TILE_X_MIN + 1) *
  TILE_SIZE;

const MOSAIC_HEIGHT =
  (TILE_Y_MAX - TILE_Y_MIN + 1) *
  TILE_SIZE;

let latestTime1 = '';

let latestTime2 = '';

let mosaicURL = '';

let previousTimestamp = '';

let z10Generation = 0;

let switchingToZ10 = false;


/* =========================================
   ひまわり赤外線
========================================= */

const SAT_SOURCE_ID = 'himawari';

const SAT_LAYER_ID = 'himawari-layer';

let latestSatValidTime = null;

let satChecking = false;


function formatSatJST(utcString) {

  const year =
    Number(utcString.slice(0, 4));

  const month =
    Number(utcString.slice(4, 6)) - 1;

  const day =
    Number(utcString.slice(6, 8));

  const hour =
    Number(utcString.slice(8, 10));

  const minute =
    Number(utcString.slice(10, 12));

  const date =
    new Date(
      Date.UTC(
        year,
        month,
        day,
        hour,
        minute
      )
    );

  date.setUTCHours(
    date.getUTCHours() + 9
  );

  const m =
    String(
      date.getUTCMonth() + 1
    ).padStart(2, '0');

  const d =
    String(
      date.getUTCDate()
    ).padStart(2, '0');

  const h =
    String(
      date.getUTCHours()
    ).padStart(2, '0');

  const min =
    String(
      date.getUTCMinutes()
    ).padStart(2, '0');

  return `${date.getUTCFullYear()}/${m}/${d} ${h}:${min} JST`;

}


async function getSatLatestTime() {

  const response =
    await fetch(
      'https://www.jma.go.jp/bosai/himawari/data/satimg/targetTimes_fd.json?' +
      Date.now(),
      {
        cache:'no-store'
      }
    );

  if (!response.ok) {

    throw new Error(
      'targetTimes_fd.json取得失敗'
    );

  }

  const data =
    await response.json();

  if (
    !Array.isArray(data) ||
    data.length === 0
  ) {

    throw new Error(
      '時刻データがありません'
    );

  }

  data.sort(
    (a, b) =>
      String(a.validtime)
        .localeCompare(
          String(b.validtime)
        )
  );

  return data[data.length - 1];

}


async function updateSatellite() {

  if (satChecking) return;

  satChecking = true;

  try {

    const target =
      await getSatLatestTime();

    const baseTime =
      String(target.basetime);

    const validTime =
      String(target.validtime);

    if (
      latestSatValidTime ===
      validTime
    ) {

      return;

    }

    const tileURL =
      'https://www.jma.go.jp/bosai/himawari/data/satimg/' +
      baseTime +
      '/fd/' +
      validTime +
      '/B13/TBB/{z}/{x}/{y}.jpg';

    if (
      map.getLayer(
        SAT_LAYER_ID
      )
    ) {

      map.removeLayer(
        SAT_LAYER_ID
      );

    }

    if (
      map.getSource(
        SAT_SOURCE_ID
      )
    ) {

      map.removeSource(
        SAT_SOURCE_ID
      );

    }

    map.addSource(
      SAT_SOURCE_ID,
      {

        type:'raster',

        tiles:[
          tileURL
        ],

        tileSize:256,

        minzoom:0,

        maxzoom:5,

        attribution:'© 気象庁'

      }
    );

    /*
      レイヤー順：

      base
        ↓
      ひまわり
        ↓
      境界線 jma-mask
        ↓
      降水ナウキャスト
    */

    map.addLayer(
      {

        id:SAT_LAYER_ID,

        type:'raster',

        source:SAT_SOURCE_ID,

        minzoom:0,

        maxzoom:19,

        paint:{

          'raster-opacity':1,

          'raster-resampling':
            'nearest',

          'raster-fade-duration':
            0

        }

      },
      'jma-mask'
    );

    latestSatValidTime =
      validTime;

    document.getElementById(
      'sat-time'
    ).textContent =
      '衛星: ' +
      formatSatJST(
        validTime
      );

  }

  catch (error) {

    console.warn(
      '衛星画像更新エラー:',
      error
    );

  }

  finally {

    satChecking = false;

  }

}


/* =========================================
   JMA通信速度チェック
========================================= */

async function checkJMAConnection() {

  if (!navigator.onLine) {

    setConnectionStatus(
      'offline'
    );

    return false;

  }

  const start =
    performance.now();

  const controller =
    new AbortController();

  const timeout =
    setTimeout(
      () => {
        controller.abort();
      },
      5000
    );

  try {

    const response =
      await fetch(
        'https://www.jma.go.jp/bosai/jmatile/data/nowc/targetTimes_N1.json?check=' +
        Date.now(),
        {
          cache:'no-store',
          signal:controller.signal
        }
      );

    clearTimeout(timeout);

    const elapsed =
      performance.now() -
      start;

    if (!response.ok) {

      if (mapReady) {

        setConnectionStatus(
          'error'
        );

      }

      return false;

    }

    if (elapsed >= 1000) {

      setConnectionStatus(
        'unstable'
      );

    }
    else {

      setConnectionStatus(
        'online'
      );

    }

    return true;

  }

  catch (error) {

    clearTimeout(timeout);

    if (!navigator.onLine) {

      setConnectionStatus(
        'offline'
      );

    }
    else {

      setConnectionStatus(
        'error'
      );

    }

    return false;

  }

}


/* =========================================
   常時通信状態確認
========================================= */

function startConnectionMonitor() {

  if (jmaConnectionTimer) {

    clearInterval(
      jmaConnectionTimer
    );

  }

  jmaConnectionTimer =
    setInterval(
      () => {

        checkJMAConnection();

      },
      3000
    );

}


/* =========================================
   最新時刻取得
========================================= */

async function fetchLatestTimes() {

  if (!navigator.onLine) {

    if (!mapReady) {

      showInitialError(
        'インターネットに接続されていません。<br>' +
        '接続を確認しています…'
      );

    }

    return false;

  }

  setLoading(
    '気象庁データの時刻を取得しています…',
    8
  );

  const start =
    performance.now();

  try {

    const response =
      await fetch(
        'https://www.jma.go.jp/bosai/jmatile/data/nowc/targetTimes_N1.json?_' +
        Date.now(),
        {
          cache:'no-store'
        }
      );

    const elapsed =
      performance.now() -
      start;

    if (!response.ok) {

      if (mapReady) {

        setConnectionStatus(
          'error'
        );

      }
      else {

        showInitialError();

      }

      return false;

    }

    if (elapsed >= 1000) {

      setConnectionStatus(
        'unstable'
      );

    }

    const data =
      await response.json();

    if (
      !Array.isArray(data) ||
      data.length === 0
    ) {

      if (mapReady) {

        setConnectionStatus(
          'error'
        );

      }
      else {

        showInitialError();

      }

      return false;

    }

    const newTime1 =
      data[0].basetime;

    const newTime2 =
      data[0].validtime;

    if (
      !newTime1 ||
      !newTime2
    ) {

      if (mapReady) {

        setConnectionStatus(
          'error'
        );

      }
      else {

        showInitialError();

      }

      return false;

    }

    const changed =
      newTime1 !== latestTime1 ||
      newTime2 !== latestTime2;

    latestTime1 =
      newTime1;

    latestTime2 =
      newTime2;

    document.getElementById(
      'nowcast-time'
    ).textContent =
      '降水: ' +
      formatSatJST(
        String(newTime2)
      );

    if (elapsed < 1000) {

      setConnectionStatus(
        'online'
      );

    }

    return changed;

  }

  catch (error) {

    console.warn(
      'JMA時刻取得エラー',
      error
    );

    if (!navigator.onLine) {

      setConnectionStatus(
        'offline'
      );

    }
    else {

      setConnectionStatus(
        'error'
      );

    }

    if (!mapReady) {

      showInitialError();

    }

    return false;

  }

}


/* =========================================
   JMAタイルURL
========================================= */

function jmaTileURL(x, y) {

  return (
    'https://www.jma.go.jp/bosai/jmatile/data/nowc/' +
    latestTime1 +
    '/none/' +
    latestTime2 +
    '/surf/hrpns/' +
    BASE_ZOOM +
    '/' +
    x +
    '/' +
    y +
    '.png'
  );

}


/* =========================================
   画像読み込み
========================================= */

function loadImage(url) {

  return new Promise(resolve => {

    const img =
      new Image();

    img.decoding =
      'async';

    img.crossOrigin =
      'anonymous';

    img.onload =
      () => resolve(img);

    img.onerror =
      () => resolve(null);

    img.src =
      url;

  });

}


/* =========================================
   Z8モザイク作成
========================================= */

async function createMosaic() {

  if (
    !latestTime1 ||
    !latestTime2
  ) {

    return false;

  }

  if (!navigator.onLine) {

    if (!mapReady) {

      showInitialError();

    }

    return false;

  }

  setLoading(
    '降水タイルを読み込んでいます…',
    15
  );

  const canvas =
    document.createElement(
      'canvas'
    );

  canvas.width =
    MOSAIC_WIDTH;

  canvas.height =
    MOSAIC_HEIGHT;

  const ctx =
    canvas.getContext(
      '2d',
      {
        alpha:true,
        willReadFrequently:false
      }
    );

  ctx.imageSmoothingEnabled =
    false;

  const jobs = [];

  const totalTiles =
    (TILE_X_MAX - TILE_X_MIN + 1) *
    (TILE_Y_MAX - TILE_Y_MIN + 1);

  let loadedTiles = 0;

  for (
    let y = TILE_Y_MIN;
    y <= TILE_Y_MAX;
    y++
  ) {

    for (
      let x = TILE_X_MIN;
      x <= TILE_X_MAX;
      x++
    ) {

      jobs.push(

        (async () => {

          if (!navigator.onLine)
            return;

          const img =
            await loadImage(
              jmaTileURL(x, y)
            );

          if (!navigator.onLine)
            return;

          if (img) {

            const dx =
              (x - TILE_X_MIN) *
              TILE_SIZE;

            const dy =
              (y - TILE_Y_MIN) *
              TILE_SIZE;

            ctx.drawImage(
              img,
              dx,
              dy,
              TILE_SIZE,
              TILE_SIZE
            );

            loadedTiles++;

          }

          const progress =
            loadedTiles /
            totalTiles;

          setLoading(
            `降水タイルを読み込み中… ${loadedTiles}/${totalTiles}`,
            15 + progress * 70
          );

        })()

      );

    }

  }

  await Promise.all(
    jobs
  );

  if (!navigator.onLine) {

    if (!mapReady) {

      showInitialError();

    }

    return false;

  }

  if (loadedTiles === 0) {

    if (mapReady) {

      setConnectionStatus(
        'error'
      );

    }
    else {

      showInitialError();

    }

    return false;

  }

  setLoading(
    '降水画像を生成しています…',
    90
  );

  return new Promise(
    resolve => {

      canvas.toBlob(
        blob => {

          if (!blob) {

            if (mapReady) {

              setConnectionStatus(
                'error'
              );

            }
            else {

              showInitialError();

            }

            resolve(false);

            return;

          }

          if (!navigator.onLine) {

            if (!mapReady) {

              showInitialError();

            }

            resolve(false);

            return;

          }

          const newURL =
            URL.createObjectURL(
              blob
            );

          if (mosaicURL) {

            URL.revokeObjectURL(
              mosaicURL
            );

          }

          mosaicURL =
            newURL;

          setLoading(
            '地図を仕上げています…',
            96
          );

          resolve(true);

        },
        'image/png'
      );

    }
  );

}


/* =========================================
   タイル座標
========================================= */

function tileXToLng(x) {

  return (
    x /
    Math.pow(
      2,
      BASE_ZOOM
    )
  ) *
  360 -
  180;

}


function tileYToLat(y) {

  const n =
    Math.PI -
    (
      2 *
      Math.PI *
      y /
      Math.pow(
        2,
        BASE_ZOOM
      )
    );

  return (
    180 /
    Math.PI
  ) *
  Math.atan(
    0.5 *
    (
      Math.exp(n) -
      Math.exp(-n)
    )
  );

}


const west =
  tileXToLng(
    TILE_X_MIN
  );

const east =
  tileXToLng(
    TILE_X_MAX + 1
  );

const north =
  tileYToLat(
    TILE_Y_MIN
  );

const south =
  tileYToLat(
    TILE_Y_MAX + 1
  );


/* =========================================
   MapLibre
   レイヤー順：

   1. 淡色ノーマル地図
   2. ひまわり赤外線
   3. 境界線
   4. 降水ナウキャスト
========================================= */

const map =
  new maplibregl.Map({

    container:'map',

    center:[
      134.5,
      34.5
    ],

    zoom:3.2,

    minZoom:3,

    maxZoom:13,

    bearing:0,

    pitch:0,

    attributionControl:false,

    antialias:false,

    preserveDrawingBuffer:false,

    fadeDuration:0,

    style:{

      version:8,

      sources:{

        /* =====================================
           淡色ノーマル地図
        ===================================== */

        'gsi-pale':{

          type:'raster',

          tiles:[
            'https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png'
          ],

          tileSize:256,

          minzoom:0,

          maxzoom:18,

          attribution:
            '© 国土地理院'

        },

        /* =====================================
           境界線
        ===================================== */

        'jma-mask':{

          type:'raster',

          tiles:[
            'https://www.jma.go.jp/bosai/jmatile/data/map/none/none/none/surf/mask/{z}/{x}/{y}.png'
          ],

          tileSize:256,

          minzoom:0,

          maxzoom:16

        }

      },

      layers:[

        /* =====================================
           1. 淡色ノーマル地図
        ===================================== */

        {

          id:'base',

          type:'raster',

          source:'gsi-pale',

          minzoom:0,

          maxzoom:18,

          paint:{

            'raster-opacity':1,

            'raster-resampling':
              'linear',

            'raster-fade-duration':
              0

          }

        },

        /* =====================================
           2. 境界線
           ※衛星を後からこの直前へ追加
        ===================================== */

        {

          id:'jma-mask',

          type:'raster',

          source:'jma-mask',

          minzoom:0,

          maxzoom:16,

          paint:{

            'raster-opacity':1,

            'raster-saturation':-1,

            'raster-resampling':
              'nearest',

            'raster-fade-duration':
              0

          }

        }

      ]

    }

  });


/* =========================================
   Z8追加・更新
   境界線より上に追加
========================================= */

function addOrUpdateZ8() {

  if (!mosaicURL)
    return;

  if (
    !map.getSource(
      'nowcast-z8-mosaic'
    )
  ) {

    map.addSource(
      'nowcast-z8-mosaic',
      {

        type:'image',

        url:mosaicURL,

        coordinates:[
          [west,north],
          [east,north],
          [east,south],
          [west,south]
        ]

      }
    );

    map.addLayer({

      id:'nowcast-z8-mosaic-layer',

      type:'raster',

      source:'nowcast-z8-mosaic',

      minzoom:3,

      maxzoom:10,

      paint:{

        'raster-opacity':
          NOWCAST_OPACITY,

        'raster-resampling':
          'nearest',

        'raster-fade-duration':
          0

      }

    });

    return;

  }

  map
    .getSource(
      'nowcast-z8-mosaic'
    )
    .updateImage({

      url:mosaicURL,

      coordinates:[
        [west,north],
        [east,north],
        [east,south],
        [west,south]
      ]

    });

}


/* =========================================
   Z10
========================================= */

function addZ10Layer(
  time1,
  time2
) {

  if (!navigator.onLine)
    return;

  const generation =
    ++z10Generation;

  const sourceId =
    'nowcast-z10-' +
    generation;

  const layerId =
    'nowcast-z10-layer-' +
    generation;

  const url =
    'https://www.jma.go.jp/bosai/jmatile/data/nowc/' +
    time1 +
    '/none/' +
    time2 +
    '/surf/hrpns/10/{x}/{y}.png';

  map.addSource(
    sourceId,
    {

      type:'raster',

      tiles:[url],

      tileSize:256,

      minzoom:10,

      maxzoom:10

    }
  );

  map.addLayer({

    id:layerId,

    type:'raster',

    source:sourceId,

    minzoom:10,

    maxzoom:14,

    paint:{

      'raster-opacity':
        NOWCAST_OPACITY,

      'raster-resampling':
        'nearest',

      'raster-fade-duration':
        0

    }

  });

  const checkLoaded = () => {

    if (
      generation !==
      z10Generation
    ) {

      return;

    }

    if (!navigator.onLine) {

      setConnectionStatus(
        'offline'
      );

      return;

    }

    const loaded =
      map.isSourceLoaded(
        sourceId
      );

    if (loaded) {

      if (
        map.getLayer(
          'nowcast-z8-mosaic-layer'
        )
      ) {

        map.setPaintProperty(
          'nowcast-z8-mosaic-layer',
          'raster-opacity',
          0
        );

      }

      const oldLayers =
        map.getStyle().layers ||
        [];

      for (
        const layer of oldLayers
      ) {

        if (
          layer.id.startsWith(
            'nowcast-z10-layer-'
          ) &&
          layer.id !== layerId
        ) {

          const oldSource =
            layer.source;

          if (
            map.getLayer(
              layer.id
            )
          ) {

            map.removeLayer(
              layer.id
            );

          }

          if (
            oldSource &&
            map.getSource(
              oldSource
            )
          ) {

            map.removeSource(
              oldSource
            );

          }

        }

      }

      switchingToZ10 =
        false;

      map.triggerRepaint();

      return;

    }

    requestAnimationFrame(
      checkLoaded
    );

  };

  requestAnimationFrame(
    checkLoaded
  );

}


/* =========================================
   ズーム切り替え
========================================= */

function updateZoomLayers() {

  if (!navigator.onLine) {

    setConnectionStatus(
      'offline'
    );

    return;

  }

  const zoom =
    map.getZoom();

  if (
    zoom >= HIGH_ZOOM
  ) {

    const z10Exists =
      map
        .getStyle()
        .layers
        .some(
          layer =>
            layer.id.startsWith(
              'nowcast-z10-layer-'
            )
        );

    if (
      !z10Exists &&
      !switchingToZ10
    ) {

      switchingToZ10 =
        true;

      addZ10Layer(
        latestTime1,
        latestTime2
      );

    }

    return;

  }

  if (
    map.getLayer(
      'nowcast-z8-mosaic-layer'
    )
  ) {

    map.setPaintProperty(
      'nowcast-z8-mosaic-layer',
      'raster-opacity',
      NOWCAST_OPACITY
    );

  }

  const layers =
    map.getStyle().layers ||
    [];

  for (
    const layer of layers
  ) {

    if (
      layer.id.startsWith(
        'nowcast-z10-layer-'
      )
    ) {

      const source =
        layer.source;

      if (
        map.getLayer(
          layer.id
        )
      ) {

        map.removeLayer(
          layer.id
        );

      }

      if (
        source &&
        map.getSource(
          source
        )
      ) {

        map.removeSource(
          source
        );

      }

    }

  }

  switchingToZ10 =
    false;

  map.triggerRepaint();

}


map.on(
  'zoom',
  updateZoomLayers
);


/* =========================================
   ナウキャスト更新
========================================= */

async function updateNowcastLayers() {

  const ready =
    await createMosaic();

  if (!ready)
    return false;

  addOrUpdateZ8();

  if (
    map.getZoom() >=
    HIGH_ZOOM
  ) {

    switchingToZ10 =
      true;

    addZ10Layer(
      latestTime1,
      latestTime2
    );

  }

  map.triggerRepaint();

  return true;

}


/* =========================================
   初期化
========================================= */

async function initialize() {

  if (initializing)
    return;

  initializing =
    true;

  const generation =
    ++initGeneration;

  showLoading();

  if (!navigator.onLine) {

    showInitialError(
      'インターネットに接続されていません。<br>' +
      '接続を確認しています…'
    );

    initializing =
      false;

    return;

  }

  const connectionOK =
    await checkJMAConnection();

  if (
    generation !==
    initGeneration
  ) {

    initializing =
      false;

    return;

  }

  if (!connectionOK) {

    showInitialError();

    initializing =
      false;

    return;

  }

  const timeResult =
    await fetchLatestTimes();

  if (
    generation !==
      initGeneration ||
    loadingError ||
    !navigator.onLine ||
    !latestTime1 ||
    !latestTime2
  ) {

    if (!mapReady) {

      showInitialError();

    }

    initializing =
      false;

    return;

  }

  const ready =
    await updateNowcastLayers();

  if (
    generation !==
      initGeneration ||
    !ready ||
    !navigator.onLine
  ) {

    if (!mapReady) {

      showInitialError();

    }

    initializing =
      false;

    return;

  }

  document.getElementById(
    'map'
  ).style.visibility =
    'visible';

  document.getElementById(
    'info-panel'
  ).style.visibility =
    'visible';

  mapReady =
    true;

  connectionStatus.style.display =
    'block';

  setConnectionStatus(
    'online'
  );

  updateZoomLayers();

  requestAnimationFrame(() => {

    map.resize();

  });

  hideLoading();

  initializing =
    false;

  startConnectionMonitor();

}


/* =========================================
   オフライン
========================================= */

window.addEventListener(
  'offline',
  () => {

    setConnectionStatus(
      'offline'
    );

    if (!mapReady) {

      showInitialError(
        'インターネットに接続されていません。<br>' +
        '接続を確認しています…'
      );

    }

  }
);


/* =========================================
   オンライン復帰
========================================= */

window.addEventListener(
  'online',
  () => {

    if (mapReady) {

      checkJMAConnection();

      return;

    }

    if (!initializing) {

      initialize();

    }

  }
);


/* =========================================
   ネットワーク状態監視
========================================= */

connectionCheckTimer =
  setInterval(
    () => {

      if (!navigator.onLine) {

        setConnectionStatus(
          'offline'
        );

        if (
          !mapReady &&
          !loadingError
        ) {

          showInitialError(
            'インターネットに接続されていません。<br>' +
            '接続を確認しています…'
          );

        }

        return;

      }

      if (mapReady) {

        checkJMAConnection();

      }

    },
    1000
  );


/* =========================================
   5分ごとのナウキャスト更新
========================================= */

async function checkNowcastUpdate() {

  if (!mapReady)
    return;

  if (!navigator.onLine) {

    setConnectionStatus(
      'offline'
    );

    return;

  }

  const changed =
    await fetchLatestTimes();

  if (!changed)
    return;

  if (!map.loaded())
    return;

  const timestamp =
    latestTime1 +
    '_' +
    latestTime2;

  if (
    timestamp ===
    previousTimestamp
  ) {

    return;

  }

  previousTimestamp =
    timestamp;

  const ready =
    await updateNowcastLayers();

  if (ready) {

    checkJMAConnection();

  }
  else {

    if (navigator.onLine) {

      setConnectionStatus(
        'error'
      );

    }

  }

}


setInterval(
  checkNowcastUpdate,
  5 * 60 * 1000
);


/* =========================================
   時計
========================================= */

function updateClock() {

  const now =
    new Date();

  const year =
    now.getFullYear();

  const month =
    String(
      now.getMonth() + 1
    ).padStart(
      2,
      '0'
    );

  const day =
    String(
      now.getDate()
    ).padStart(
      2,
      '0'
    );

  const hours =
    String(
      now.getHours()
    ).padStart(
      2,
      '0'
    );

  const minutes =
    String(
      now.getMinutes()
    ).padStart(
      2,
      '0'
    );

  const seconds =
    String(
      now.getSeconds()
    ).padStart(
      2,
      '0'
    );

  document.getElementById(
    'clock'
  ).textContent =
    `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;

}


setInterval(
  updateClock,
  1000
);

updateClock();


/* =========================================
   MapLibreエラー
========================================= */

map.on(
  'error',
  event => {

    if (
      event &&
      event.error
    ) {

      console.warn(
        'MapLibre:',
        event.error
      );

      if (mapReady) {

        setConnectionStatus(
          'error'
        );

      }

    }

  }
);


/* =========================================
   Map読み込み完了
========================================= */

map.on(
  'load',
  () => {

    updateSatellite().then(() => {

      initialize();

    });

    setInterval(
      updateSatellite,
      1000
    );

    document.addEventListener(
      'visibilitychange',
      () => {

        if (!document.hidden) {

          updateSatellite();

        }

      }
    );

  }
);

</script>
